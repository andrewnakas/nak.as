<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nak's Awakening</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230f380f'/><rect x='4' y='4' width='8' height='8' fill='%239bbc0e'/></svg>">
<meta name="description" content="Nak's Awakening — a Game Boy-style co-op action RPG you can play with friends, right in the browser.">
<style>
  :root {
    --gb-darkest: #16181d;
    --gb-dark: #2f5b4a;
    --gb-light: #6f8a5b;
    --gb-lightest: #cdd6bd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a12;
    color: #cfd8c2;
    font-family: ui-monospace, Menlo, Monaco, monospace;
    overflow: hidden;
  }
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #screen {
    image-rendering: pixelated;
    background: var(--gb-darkest);
    border-radius: 4px;
    box-shadow: 0 0 0 6px #1a1a2e, 0 0 40px rgba(139, 172, 15, 0.15);
  }
  #hud-text {
    font-size: 11px;
    opacity: 0.55;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.6;
  }
  #hud-text a { color: var(--gb-light); }
  #debug {
    position: fixed;
    top: 6px;
    left: 8px;
    font-size: 10px;
    opacity: 0.4;
    white-space: pre;
    display: none;
  }
  #menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px 0;
    overflow-y: auto;
    background: #0a0a12;
    z-index: 10;
  }
  #menu h1 {
    color: var(--gb-lightest);
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 0 0 18px rgba(139, 172, 15, 0.4);
  }
  #menu button {
    font: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 2px solid var(--gb-dark);
    border-radius: 3px;
    padding: 10px 26px;
    min-width: 220px;
    cursor: pointer;
  }
  #menu button:hover { border-color: var(--gb-light); }
  #menu input {
    font: inherit;
    font-size: 13px;
    color: var(--gb-lightest);
    background: #11111c;
    border: 2px solid var(--gb-dark);
    border-radius: 3px;
    padding: 8px 10px;
    width: 216px;
    text-align: center;
  }
  #menu input::placeholder { color: #4c5c4c; }
  .tagline { font-size: 11px; color: var(--gb-light); opacity: 0.8; margin-top: -6px; margin-bottom: 4px; }
  #menu-enter { font-size: 15px !important; }
  .join-row { display: flex; gap: 6px; }
  .join-row input { width: 110px; text-transform: uppercase; }
  .join-row button { min-width: 96px; }
  #status { font-size: 12px; color: var(--gb-light); min-height: 16px; }
  #auth-box {
    border-top: 1px solid #22322a;
    margin-top: 6px;
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #auth-form { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #auth-form input { width: 216px; text-align: left; }
  #auth-form .join-row button { min-width: 104px; }
  .auth-note { font-size: 10px; color: #4c5c4c; max-width: 230px; text-align: center; }
  #auth-state { font-size: 12px; color: var(--gb-light); display: flex; gap: 10px; align-items: center; }
  #auth-state button {
    min-width: auto; padding: 4px 10px; font-size: 10px;
  }
  #friends-box { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #friends-list { font-size: 11px; color: #9cab9c; display: flex; flex-direction: column; gap: 3px; }
  #friends-list .frow { display: flex; gap: 8px; align-items: center; }
  #friends-list button { min-width: auto; padding: 2px 8px; font-size: 9px; }
  #friends-box input { width: 120px; }
  #friends-box .join-row button { min-width: 60px; }
  #party-code { color: var(--gb-lightest); }
  #inv {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 18, 0.85);
    z-index: 9;
  }
  #inv-panel {
    background: #11181c;
    border: 2px solid var(--gb-dark);
    border-radius: 6px;
    width: min(440px, 94vw);
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #inv-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 8px 8px 10px;
    border-bottom: 1px solid var(--gb-dark);
    flex: 0 0 auto;
  }
  #inv-tabs { display: flex; gap: 4px; }
  .inv-tab {
    font: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--gb-light);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 6px 10px;
    cursor: pointer;
  }
  .inv-tab.active { color: var(--gb-lightest); border-bottom-color: var(--gb-light); }
  #inv-close {
    font: inherit;
    font-size: 16px;
    line-height: 1;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 1px solid var(--gb-dark);
    border-radius: 4px;
    width: 34px; height: 34px;
    cursor: pointer;
  }
  #inv-list {
    padding: 8px 10px 12px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .inv-section {
    color: var(--gb-light);
    font-size: 10px;
    letter-spacing: 2px;
    margin: 12px 2px 4px;
    opacity: 0.85;
  }
  .inv-section:first-child { margin-top: 2px; }
  .inv-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 4px;
    font-size: 12px;
    min-height: 36px;
  }
  .inv-row:nth-child(odd) { background: rgba(139, 172, 15, 0.05); }
  .inv-icon {
    width: 28px; height: 28px;
    flex: 0 0 auto;
    image-rendering: pixelated;
    border-radius: 3px;
    background: rgba(0,0,0,0.25);
  }
  .inv-skills { color: var(--gb-light); font-size: 11px; letter-spacing: 1px; line-height: 1.7; }
  .inv-level { color: var(--gb-lightest); font-size: 13px; letter-spacing: 1px; font-weight: bold; }
  .inv-name { flex: 1; color: #cfd8c2; }
  .inv-name .fused { color: var(--gb-light); font-size: 10px; }
  .inv-meta { color: #8c9c84; font-size: 10px; min-width: 56px; text-align: right; }
  .inv-row button {
    font: inherit;
    font-size: 11px;
    padding: 6px 10px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 1px solid var(--gb-dark);
    border-radius: 3px;
    cursor: pointer;
  }
  .inv-row button:hover { border-color: var(--gb-light); }
  .inv-row button.active { background: var(--gb-dark); border-color: var(--gb-light); }
  .inv-empty { color: #6c7c6c; font-size: 12px; padding: 16px 4px; text-align: center; }

  /* ---- BotW-style visual inventory: category chips + icon grid + detail ---- */
  .inv-cats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 2px 0 8px;
  }
  .inv-cat {
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--gb-light);
    background: var(--gb-darkest);
    border: 1px solid var(--gb-dark);
    border-radius: 4px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .inv-cat .badge-n { color: #8c9c84; }
  .inv-cat.active { color: #16181d; background: var(--gb-light); border-color: var(--gb-lightest); }
  .inv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
    gap: 6px;
    margin-bottom: 8px;
  }
  .inv-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.28);
    border: 2px solid var(--gb-dark);
    border-radius: 6px;
    cursor: pointer;
    overflow: hidden;
  }
  .inv-cell:hover { border-color: var(--gb-light); }
  .inv-cell.selected { border-color: var(--gb-lightest); background: rgba(139, 172, 15, 0.14); }
  .inv-cell.equipped { border-color: #c99a46; box-shadow: inset 0 0 0 1px #c99a46; }
  .inv-cell img {
    width: 80%; height: 80%;
    image-rendering: pixelated;
  }
  .inv-cell .qty {
    position: absolute;
    right: 2px; bottom: 1px;
    font-size: 10px;
    color: var(--gb-lightest);
    text-shadow: 0 1px 2px #000, 0 0 2px #000;
  }
  .inv-cell .slotbadge {
    position: absolute;
    left: 2px; top: 1px;
    font-size: 9px;
    font-weight: bold;
    color: #16181d;
    background: #c99a46;
    border-radius: 3px;
    padding: 0 3px;
    line-height: 1.4;
  }
  .inv-cell .modbadge {
    position: absolute;
    right: 2px; top: 1px;
    font-size: 9px;
    color: #16181d;
    background: #6f8a5b;
    border-radius: 3px;
    padding: 0 3px;
    line-height: 1.4;
  }
  .inv-cell .durbar {
    position: absolute;
    left: 3px; right: 3px; bottom: 2px;
    height: 3px;
    border-radius: 2px;
    background: rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .inv-cell .durbar > span { display: block; height: 100%; background: #8bac0f; }
  .inv-detail {
    display: flex;
    gap: 10px;
    padding: 10px;
    margin-top: 4px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--gb-dark);
    border-radius: 6px;
  }
  .inv-detail .dicon {
    width: 56px; height: 56px;
    flex: 0 0 auto;
    image-rendering: pixelated;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 4px;
  }
  .inv-detail .dbody { flex: 1; min-width: 0; }
  .inv-detail .dname { color: var(--gb-lightest); font-size: 13px; letter-spacing: 0.5px; }
  .inv-detail .dsub { color: #8c9c84; font-size: 10px; margin: 2px 0 8px; line-height: 1.5; }
  .inv-detail .dsub .tag { color: #c0d090; }
  .inv-detail .dactions { display: flex; flex-wrap: wrap; gap: 6px; }
  .inv-detail .dactions button {
    font: inherit;
    font-size: 11px;
    padding: 6px 11px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 1px solid var(--gb-dark);
    border-radius: 3px;
    cursor: pointer;
  }
  .inv-detail .dactions button:hover { border-color: var(--gb-light); }
  .inv-detail .dactions button.active { background: var(--gb-dark); border-color: #c99a46; color: #e0c071; }
  #toasts {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 8;
  }
  #vendor-prompt {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    background: rgba(47, 91, 74, 0.92);
    color: var(--gb-lightest);
    border: 1px solid var(--gb-light);
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 12px;
    pointer-events: none;
    z-index: 8;
  }
  .toast {
    background: rgba(15, 56, 15, 0.92);
    color: var(--gb-lightest);
    border: 1px solid var(--gb-dark);
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 12px;
    animation: toast-fade 2.6s forwards;
  }
  @keyframes toast-fade {
    0% { opacity: 0; transform: translateY(6px); }
    10%, 75% { opacity: 1; transform: none; }
    100% { opacity: 0; }
  }

  /* ---- on-screen touch controls ---- */
  #touch-controls {
    display: none; /* shown by TouchControls on touch devices */
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 200px;
    padding: 0 22px env(safe-area-inset-bottom, 16px);
    justify-content: space-between;
    align-items: center;
    z-index: 7;
    pointer-events: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #touch-controls > * { pointer-events: auto; }
  /* leave room at the bottom for the controls on touch devices */
  body.has-touch #hud-text { display: none; }
  body.has-touch #stage {
    height: calc(100% - 200px);
    justify-content: center;
    padding-top: 4px;
  }

  #dpad {
    position: relative;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(22, 24, 29, 0.55);
    border: 2px solid rgba(111, 138, 91, 0.4);
    touch-action: none;
  }
  .dpad-center {
    position: absolute;
    left: 50%; top: 50%;
    width: 44px; height: 44px;
    transform: translate(-50%, -50%);
    border-radius: 8px;
    background: rgba(47, 91, 74, 0.5);
  }
  .arrow {
    position: absolute;
    width: 0; height: 0;
    opacity: 0.55;
    transition: opacity 0.05s;
  }
  .arrow.on { opacity: 1; }
  .arrow-up {
    left: 50%; top: 16px; transform: translateX(-50%);
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-bottom: 18px solid var(--gb-lightest);
  }
  .arrow-down {
    left: 50%; bottom: 16px; transform: translateX(-50%);
    border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 18px solid var(--gb-lightest);
  }
  .arrow-left {
    top: 50%; left: 16px; transform: translateY(-50%);
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    border-right: 18px solid var(--gb-lightest);
  }
  .arrow-right {
    top: 50%; right: 16px; transform: translateY(-50%);
    border-top: 14px solid transparent; border-bottom: 14px solid transparent;
    border-left: 18px solid var(--gb-lightest);
  }

  #face-buttons {
    position: relative;
    width: 150px;
    height: 150px;
  }
  .face {
    position: absolute;
    font: inherit;
    font-weight: bold;
    color: var(--gb-lightest);
    background: rgba(47, 91, 74, 0.6);
    border: 2px solid rgba(205, 214, 189, 0.45);
    border-radius: 50%;
    width: 64px; height: 64px;
    font-size: 22px;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .face.pressed { background: var(--gb-light); transform: scale(0.93); }
  /* A lower-right, B upper-left (Game Boy diagonal layout) */
  .face.a { right: 0; bottom: 18px; }
  .face.b { left: 0; top: 32px; }
  .face.pack {
    width: 44px; height: 44px; font-size: 18px;
    left: 50%; top: -8px; transform: translateX(-50%);
    background: rgba(22, 24, 29, 0.6);
  }
  .face.pack.pressed { transform: translateX(-50%) scale(0.93); }

  /* connecting overlay over the canvas (no bare black screen for clients) */
  #screen-wrap { position: relative; line-height: 0; }
  #connecting {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 1px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border-radius: 4px;
  }

  #av-controls {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }
  #voice-toggle, #music-toggle, #party-toggle {
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.5px;
    padding: 4px 7px;
    color: var(--gb-lightest);
    background: rgba(22, 24, 29, 0.82);
    border: 1px solid var(--gb-light);
    border-radius: 4px;
    cursor: pointer;
  }
  #party-toggle.on { color: #16181d; background: #c99a46; border-color: #efe6d2; }
  #party-panel {
    position: absolute;
    top: 34px;
    right: 6px;
    z-index: 6;
    width: 168px;
    max-height: 50%;
    overflow-y: auto;
    padding: 6px;
    font-size: 10px;
    color: var(--gb-lightest);
    background: rgba(22, 24, 29, 0.92);
    border: 1px solid var(--gb-light);
    border-radius: 4px;
    pointer-events: auto;
  }
  #party-panel .prow {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
  }
  #party-panel .prow .pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #party-panel .prow .pname.member { color: #e0c071; }
  #party-panel button {
    font-family: inherit;
    font-size: 9px;
    padding: 2px 5px;
    color: var(--gb-lightest);
    background: rgba(40, 44, 52, 0.9);
    border: 1px solid var(--gb-light);
    border-radius: 3px;
    cursor: pointer;
  }
  #party-panel button.on { color: #16181d; background: #c99a46; }
  #party-panel .phint { color: #8c9c84; padding: 2px 0; }
  .toast.confirm { display: flex; gap: 6px; align-items: center; }
  .toast.confirm button {
    font-family: inherit; font-size: 10px; padding: 2px 7px; cursor: pointer;
    color: var(--gb-lightest); background: rgba(40,44,52,0.9);
    border: 1px solid var(--gb-light); border-radius: 3px;
  }
  #music-toggle.off { opacity: 0.5; text-decoration: line-through; }
  #music-vol {
    width: 56px;
    accent-color: #6f8a5b;
    background: transparent;
    cursor: pointer;
  }
  #voice-toggle.on {
    color: #16181d;
    background: #6f8a5b;
    border-color: #efe6d2;
  }
  #voice-toggle.error { border-color: #b44a3a; color: #efb9af; }

  #minimap {
    position: absolute;
    bottom: 6px;
    right: 6px;
    z-index: 5;
    image-rendering: pixelated;
    border-radius: 3px;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0.9;
  }

  /* block iOS pinch / double-tap zoom on the play area */
  html, body { touch-action: manipulation; overscroll-behavior: none; }
  #stage, #touch-controls { touch-action: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="screen-wrap">
      <canvas id="screen" width="160" height="144"></canvas>
      <div id="connecting">connecting to the world…</div>
      <div id="av-controls" hidden>
        <button id="voice-toggle" title="Proximity voice chat">🎙 voice off</button>
        <button id="party-toggle" title="Party: invite players, warp & follow">👥 party</button>
        <button id="music-toggle" title="Music on/off">🎵</button>
        <input id="music-vol" type="range" min="0" max="100" value="100" title="Music volume">
      </div>
      <div id="party-panel" hidden></div>
      <canvas id="minimap" title="Map (click to expand)" hidden></canvas>
    </div>
    <div id="hud-text">
      <span id="party-code"></span> <span id="party-list"></span><br>
      NAK'S AWAKENING — pre-alpha · arrows/WASD move · <a href="/">nak.as</a>
    </div>
  </div>
  <div id="menu">
    <h1>NAK'S AWAKENING</h1>
    <div class="tagline">a tiny co-op world you wander into</div>
    <input id="menu-name" maxlength="16" placeholder="your name">
    <button id="menu-enter">ENTER THE WORLD</button>
    <div id="auth-box">
      <div id="auth-form">
        <input id="auth-user" maxlength="16" placeholder="username" autocomplete="username">
        <input id="auth-pass" type="password" maxlength="128" placeholder="password" autocomplete="current-password">
        <div class="join-row">
          <button id="auth-login">LOG IN</button>
          <button id="auth-register">REGISTER</button>
        </div>
        <div class="auth-note">log in to keep your character in the cloud — or just play</div>
      </div>
      <div id="auth-state" style="display:none">
        <span id="auth-who"></span> <button id="auth-logout">LOG OUT</button>
      </div>
      <div id="friends-box" style="display:none">
        <div id="friends-list"></div>
        <div class="join-row">
          <input id="friend-name" maxlength="16" placeholder="add friend">
          <button id="friend-add">ADD</button>
        </div>
      </div>
    </div>
    <div id="status"></div>
  </div>
  <div id="inv">
    <div id="inv-panel">
      <div id="inv-head">
        <div id="inv-tabs">
          <button class="inv-tab" data-tab="items">ITEMS</button>
          <button class="inv-tab" data-tab="quests">QUESTS</button>
          <button class="inv-tab" data-tab="skills">SKILLS</button>
        </div>
        <button id="inv-close" title="close">✕</button>
      </div>
      <div id="inv-list"></div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="vendor-prompt">press I — shop here</div>

  <!-- On-screen Game Boy controls (touch devices only) -->
  <div id="touch-controls">
    <div id="dpad">
      <div class="arrow arrow-up"></div>
      <div class="arrow arrow-down"></div>
      <div class="arrow arrow-left"></div>
      <div class="arrow arrow-right"></div>
      <div class="dpad-center"></div>
    </div>
    <div id="face-buttons">
