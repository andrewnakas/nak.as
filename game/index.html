<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nak's Awakening</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230f380f'/><rect x='4' y='4' width='8' height='8' fill='%239bbc0e'/></svg>">
<meta name="description" content="Nak's Awakening — a Game Boy-style co-op action RPG you can play with friends, right in the browser.">
<style>
  :root {
    --gb-darkest: #0f380f;
    --gb-dark: #306230;
    --gb-light: #8bac0f;
    --gb-lightest: #9bbc0e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a12;
    color: #cfd8c2;
    font-family: ui-monospace, Menlo, Monaco, monospace;
    overflow: hidden;
  }
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #screen {
    image-rendering: pixelated;
    background: var(--gb-darkest);
    border-radius: 4px;
    box-shadow: 0 0 0 6px #1a1a2e, 0 0 40px rgba(139, 172, 15, 0.15);
  }
  #hud-text {
    font-size: 11px;
    opacity: 0.55;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.6;
  }
  #hud-text a { color: var(--gb-light); }
  #debug {
    position: fixed;
    top: 6px;
    left: 8px;
    font-size: 10px;
    opacity: 0.4;
    white-space: pre;
    display: none;
  }
  #menu {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10, 10, 18, 0.92);
    z-index: 10;
  }
  #menu h1 {
    color: var(--gb-lightest);
    font-size: 22px;
    letter-spacing: 3px;
    text-shadow: 0 0 18px rgba(139, 172, 15, 0.4);
  }
  #menu button {
    font: inherit;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 2px solid var(--gb-dark);
    border-radius: 3px;
    padding: 10px 26px;
    min-width: 220px;
    cursor: pointer;
  }
  #menu button:hover { border-color: var(--gb-light); }
  #menu input {
    font: inherit;
    font-size: 13px;
    color: var(--gb-lightest);
    background: #11111c;
    border: 2px solid var(--gb-dark);
    border-radius: 3px;
    padding: 8px 10px;
    width: 216px;
    text-align: center;
  }
  #menu input::placeholder { color: #4c5c4c; }
  .join-row { display: flex; gap: 6px; }
  .join-row input { width: 110px; text-transform: uppercase; }
  .join-row button { min-width: 96px; }
  #status { font-size: 12px; color: var(--gb-light); min-height: 16px; }
  #party-code { color: var(--gb-lightest); }
  #inv {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 18, 0.85);
    z-index: 9;
  }
  #inv-panel {
    background: #11181c;
    border: 2px solid var(--gb-dark);
    border-radius: 4px;
    padding: 14px 16px;
    width: min(420px, 92vw);
    max-height: 80vh;
    overflow-y: auto;
  }
  #inv-panel h2 {
    color: var(--gb-lightest);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .inv-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
  .inv-row:nth-child(odd) { background: rgba(139, 172, 15, 0.05); }
  .inv-skills { color: var(--gb-light); font-size: 10px; letter-spacing: 1px; }
  .inv-name { flex: 1; color: #cfd8c2; }
  .inv-name .fused { color: var(--gb-light); font-size: 10px; }
  .inv-meta { color: #6c7c6c; font-size: 10px; min-width: 52px; text-align: right; }
  .inv-row button {
    font: inherit;
    font-size: 10px;
    padding: 3px 8px;
    color: var(--gb-lightest);
    background: var(--gb-darkest);
    border: 1px solid var(--gb-dark);
    border-radius: 2px;
    cursor: pointer;
  }
  .inv-row button:hover { border-color: var(--gb-light); }
  .inv-row button.active { background: var(--gb-dark); border-color: var(--gb-light); }
  #inv-hint { font-size: 10px; color: #6c7c6c; margin-top: 10px; }
  #toasts {
    position: fixed;
    bottom: 84px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 8;
  }
  .toast {
    background: rgba(15, 56, 15, 0.92);
    color: var(--gb-lightest);
    border: 1px solid var(--gb-dark);
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 12px;
    animation: toast-fade 2.6s forwards;
  }
  @keyframes toast-fade {
    0% { opacity: 0; transform: translateY(6px); }
    10%, 75% { opacity: 1; transform: none; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="160" height="144"></canvas>
    <div id="hud-text">
      <span id="party-code"></span> <span id="party-list"></span><br>
      NAK'S AWAKENING — pre-alpha · arrows/WASD move · <a href="/">nak.as</a>
    </div>
  </div>
  <div id="menu">
    <h1>NAK'S AWAKENING</h1>
    <input id="menu-name" maxlength="16" placeholder="your name">
    <button id="menu-solo">PLAY SOLO</button>
    <button id="menu-host">HOST A PARTY</button>
    <div class="join-row">
      <input id="menu-code" maxlength="5" placeholder="CODE">
      <button id="menu-join">JOIN</button>
    </div>
    <div id="status"></div>
  </div>
  <div id="inv">
    <div id="inv-panel">
      <h2>PACK</h2>
      <div id="inv-list"></div>
      <div id="inv-hint">I or ESC to close · A = sword hand · B = item hand · FUSE a material onto a weapon</div>
    </div>
  </div>
  <div id="toasts"></div>
  <div id="debug"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
