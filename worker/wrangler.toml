name = "naks-awakening-api"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Custom domain (added in the Cloudflare dash or via `wrangler deploy`):
# api.nak.as -> this worker. Local dev runs on http://localhost:8787.
routes = [
  { pattern = "api.nak.as", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# `wrangler dev` runs a local sqlite copy regardless of the id.
[[d1_databases]]
binding = "DB"
database_name = "naks-awakening"
database_id = "929dc96c-0b52-467a-a84a-78fd8241a16e"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
