<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Andrew Nakas</title>
<meta name="description" content="Andrew Nakas — personal site." />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
<meta property="og:title" content="Andrew Nakas" />
<meta property="og:description" content="Andrew Nakas — personal site." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://nak.as" />
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 28px;
    z-index: 2;
    pointer-events: none;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  model-viewer {
    flex: 1;
    width: 100%;
    height: 100%;
    background: #000;
    --progress-bar-color: #fff;
    --progress-bar-height: 1px;
    --poster-color: #000;
  }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 20px 28px;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    pointer-events: none;
  }
  footer a {
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    pointer-events: auto;
  }
  footer a:hover { color: #fff; }
  .hint {
    pointer-events: none;
    user-select: none;
  }
  @media (max-width: 600px) {
    header { padding: 18px 20px; }
    footer { padding: 16px 20px; font-size: 11px; }
    header h1 { font-size: 15px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Andrew Nakas</h1>
  </header>

  <model-viewer
    src="andrew_nakas_3d_scan.glb"
    alt="3D scan of Andrew Nakas"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
    interaction-prompt="none"
    exposure="1.0"
    shadow-intensity="0"
    environment-image="neutral"
    camera-orbit="0deg 90deg auto"
    min-camera-orbit="auto 0deg auto"
    max-camera-orbit="auto 180deg auto"
    style="background:#000;">
  </model-viewer>

  <footer>
    <span class="hint">Drag to rotate · Scroll to zoom</span>
    <a href="mailto:andrew.nakas@gmail.com">andrew.nakas@gmail.com</a>
  </footer>
</body>
</html>
